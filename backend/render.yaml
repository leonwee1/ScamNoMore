# Render Blueprint — optional one-click alternative to the dashboard steps.
#
# Use it via Render → New → Blueprint → pick this repo. Render reads this file and
# creates the service. You will still be prompted for the two secret values,
# because they are marked sync:false (never committed to git).
#
# Manual dashboard setup is documented in docs/DEPLOY_RENDER.md.
services:
  - type: web
    name: scamnomore-backend
    runtime: node
    # SQLite permanence requires a paid service plus a persistent disk. Free
    # instances have an ephemeral filesystem and would lose reports/messages.
    plan: 0.5c-512mb
    disk:
      name: scamnomore-data
      mountPath: /var/data
      sizeGB: 1
    # The backend is a subfolder of the repo.
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false # you paste this in the dashboard
      - key: APP_SHARED_SECRET
        sync: false # you paste this in the dashboard
      - key: REPORTS_DB_PATH
        value: /var/data/scamnomore.sqlite
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1
      - key: RATE_LIMIT_BURST_MAX
        value: "15"
      - key: RATE_LIMIT_DAILY_MAX
        value: "200"
      # Absolute demo-wide caps: keep these within the OpenAI budget you intend
      # to spend even if a bundled app secret is copied from the Expo app.
      - key: RATE_LIMIT_GLOBAL_BURST_MAX
        value: "60"
      - key: RATE_LIMIT_GLOBAL_DAILY_MAX
        value: "250"
