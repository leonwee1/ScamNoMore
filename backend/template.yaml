AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ScamNoMore backend - Rekognition, Rekognition Video, Transcribe, Bedrock, DynamoDB

Parameters:
  BedrockModelId:
    Type: String
    Default: apac.anthropic.claude-3-5-sonnet-20240620-v1:0
    Description: Bedrock model (or cross-region inference profile) to invoke.
  ScamTableName:
    Type: String
    Default: ScamNoMoreScams

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]         # cheapest option
    MemorySize: 512
    Timeout: 120                   # Rekognition Video / Transcribe polling
    Environment:
      Variables:
        MEDIA_BUCKET: !Ref MediaBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        SCAM_TABLE: !Ref ScamTableName
    Handler: index.handler

Resources:
  # ---------- API ----------
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['Content-Type']
        AllowMethods: ['OPTIONS', 'POST']

  # ---------- Media storage ----------
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        # Allows the app to PUT directly to a presigned URL.
        CorsRules:
          - AllowedMethods: [PUT, GET]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            MaxAge: 3000
      LifecycleConfiguration:
        # User media is transient; delete it to protect privacy and cut cost.
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            ExpirationInDays: 1
            Prefix: uploads/
          - Id: ExpireTranscripts
            Status: Enabled
            ExpirationInDays: 1
            Prefix: transcripts/

  # ---------- Scam case table (shared by the 5000 rows + user reports) ----------
  ScamTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ScamTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }

  # ---------- Functions ----------
  UploadUrlFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/handlers/
      Handler: uploadUrl.handler
      Policies:
        - S3WritePolicy: { BucketName: !Ref MediaBucket }
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /upload-url, Method: POST }

  AnalyzeImageFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/handlers/
      Handler: analyzeImage.handler
      Policies:
        - S3ReadPolicy: { BucketName: !Ref MediaBucket }
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectText
                - rekognition:DetectLabels
                - rekognition:DetectModerationLabels
              Resource: '*'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /analyze/image, Method: POST }

  AnalyzeVideoFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/handlers/
      Handler: analyzeVideo.handler
      Timeout: 300
      Policies:
        - S3ReadPolicy: { BucketName: !Ref MediaBucket }
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:StartTextDetection
                - rekognition:GetTextDetection
                - rekognition:StartLabelDetection
                - rekognition:GetLabelDetection
              Resource: '*'
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /analyze/video, Method: POST }

  TranscribeFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/handlers/
      Handler: transcribe.handler
      Timeout: 300
      Policies:
        - S3CrudPolicy: { BucketName: !Ref MediaBucket }
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
              Resource: '*'
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /transcribe, Method: POST }

  AnalyzeTextFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/handlers/
      Handler: analyzeText.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /analyze/text, Method: POST }

  ChatFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/handlers/
      Handler: chat.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: '*'
      Events:
        Post:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: /chat, Method: POST }

Outputs:
  ApiBaseUrl:
    Description: Put this in app.json -> expo.extra.apiBaseUrl
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod'
  MediaBucketName:
    Value: !Ref MediaBucket
